<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="shell">
        <div class="header-block">
            <h1>Wiki Explorer</h1>
            <div class="rule"></div>
        </div>

        <div class="mode-toggle" role="tablist">
            <button class="mode-btn active" data-mode="single" type="button">Single</button>
            <button class="mode-btn" data-mode="compare" type="button">Compare</button>
        </div>

        <div class="search-row" id="singleSearchRow">
            <input type="text" id="searchBox" class="term-input" placeholder="Type a topic…" autocomplete="off">
            <button id="searchBtn" class="btn-amber" type="button">Search</button>
        </div>

        <div class="compare-search-row" id="compareSearchRow" hidden>
            <div class="compare-inputs">
                <input type="text" id="searchBoxA" class="term-input" placeholder="First topic…" autocomplete="off">
                <span class="vs-label">VS</span>
                <input type="text" id="searchBoxB" class="term-input" placeholder="Second topic…" autocomplete="off">
            </div>
            <button id="compareBtn" class="btn-amber" type="button">Compare</button>
        </div>

        <div id="result" class="state-idle">
            <p class="placeholder-msg">Type any topic — a place, a person, an event — and search.</p>
        </div>

        <div class="history-wrap" id="historyWrap" hidden>
            <p class="history-label">Recently Searched</p>
            <div class="history-list" id="historyList"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
